[project]
name = "devdocs-mcp"
version = "0.1.0"
description = "MCP server for devdocs.io documentation with semantic search and custom sources"
requires-python = ">=3.13"
dependencies = [
    "mcp>=2,<3",
    "httpx>=0.28.0",
    "platformdirs>=4.0.0",
    "lxml>=5.0.0",
    "html2text>=2025.4.15",
]

[project.optional-dependencies]
ml = [
    # >=1.7.4 required: faiss_index.EmbeddingIndex.search() uses
    # Index.search(..., params=faiss.SearchParameters(sel=IDSelectorBatch(...)))
    # to scope filtered searches (by slug/source_type) before ranking,
    # which needs the generic search-with-parameters support added in 1.7.4.
    "faiss-cpu>=1.7.4",
    "sentence-transformers>=2.2.0",
    "numpy>=1.24.0",
]

[project.scripts]
devdocs-mcp = "devdocs_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
